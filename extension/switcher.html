<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tabatha</title>
  <link rel="stylesheet" href="switcher.css">
</head>
<body>
  <div id="app" hidden>
    <header class="bar">
      <button id="newtab" class="ghost" type="button">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        New tab
      </button>
      <label class="search">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search open tabs and tabs closed in the last 7 days" autocomplete="off" spellcheck="false" aria-label="Search tabs" aria-controls="open-grid closed-grid">
        <span id="count" class="count" aria-live="polite"></span>
      </label>
      <div class="hint" aria-hidden="true">
        <kbd>←</kbd><kbd>→</kbd> move · <kbd>Enter</kbd> open · <kbd data-mac="⌘⌫">Del</kbd> close tab · <kbd>Esc</kbd> exit<span id="hint-win" hidden> · <kbd data-mac="⌥W">Alt+W</kbd> window</span>
      </div>
    </header>

    <nav id="windows" class="windows" aria-label="Windows" hidden></nav>

    <main id="scroller">
      <section aria-labelledby="open-h">
        <h2 id="open-h" class="section-h">Open tabs</h2>
        <div id="open-grid" class="sections" role="listbox" aria-labelledby="open-h"></div>
        <p id="open-empty" class="empty" hidden>No open tabs match your search.</p>
      </section>
      <section id="saved-section" aria-labelledby="saved-h" hidden>
        <h2 id="saved-h" class="section-h">Saved tab groups <span class="sub">closed groups stay here until you remove them</span></h2>
        <div id="saved-grid" class="grid small" role="listbox" aria-labelledby="saved-h"></div>
      </section>
      <section id="closed-section" aria-labelledby="closed-h" hidden>
        <h2 id="closed-h" class="section-h">Recently closed</h2>
        <div id="closed-grid" class="grid small" role="listbox" aria-labelledby="closed-h"></div>
      </section>
    </main>
    <div class="foot">
      <button id="tour-btn" class="link" type="button" title="A short tour of Tabatha"><span class="q" aria-hidden="true">?</span>How it works</button>
      <button id="groups-btn" class="link" type="button" hidden title="Show your Chrome tab groups here, and keep them when you close them">Turn on tab groups</button>
      <div id="soft" class="soft" hidden>
        <span>Enjoying Tabatha?</span>
        <button id="soft-review" class="link strong" type="button">Rate it on the Chrome Web Store</button>
        <button id="soft-later" class="link" type="button">Maybe later</button>
        <button id="soft-never" class="link" type="button" aria-label="Don't ask again" title="Don't ask again">&times;</button>
      </div>
    </div>
    <div id="modal" class="modal-back" hidden>
      <div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"></div>
    </div>
    <button id="coffee" class="coffee" type="button" title="Tabatha is free. If it saves you time, you can buy me a coffee.">
      <svg viewBox="0 0 12 12" width="18" height="18" shape-rendering="crispEdges" aria-hidden="true"><g fill="#1B2A4A"><rect x="3" y="0" width="1" height="2"/><rect x="4" y="2" width="1" height="1"/><rect x="6" y="0" width="1" height="2"/><rect x="7" y="2" width="1" height="1"/><rect x="1" y="4" width="8" height="1"/><rect x="1" y="5" width="1" height="5"/><rect x="8" y="5" width="1" height="5"/><rect x="2" y="10" width="6" height="1"/><rect x="9" y="5" width="2" height="1"/><rect x="10" y="6" width="1" height="2"/><rect x="9" y="8" width="2" height="1"/></g><rect x="2" y="5" width="6" height="2" fill="#7A4E2D"/><rect x="2" y="7" width="6" height="3" fill="#FFF8E7"/><rect x="2" y="7" width="2" height="1" fill="#FF9EC7"/></svg><span>Buy me a coffee</span>
    </button>
  </div>
  <script type="module" src="switcher.js"></script>
</body>
</html>
