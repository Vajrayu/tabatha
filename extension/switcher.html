<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tabatha</title>
  <link rel="stylesheet" href="switcher.css">
</head>
<body>
  <div id="app" hidden>
    <header class="bar">
      <button id="newtab" class="ghost" type="button">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
        <span data-i18n="newTab">New tab</span>
      </button>
      <label class="search">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M10.5 10.5 14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchAria" autocomplete="off" spellcheck="false" aria-controls="open-grid closed-grid">
        <span id="count" class="count" aria-live="polite"></span>
      </label>
      <div class="hint" aria-hidden="true">
        <kbd>←</kbd><kbd>→</kbd> <span data-i18n="hintMove">move</span> · <kbd>Enter</kbd> <span data-i18n="hintOpen">open</span> · <kbd data-mac="⌘⌫">Del</kbd> <span data-i18n="hintClose">close tab</span> · <kbd data-mac="⌥S">Alt+S</kbd> <span data-i18n="hintStar">star</span> · <kbd>Esc</kbd> <span data-i18n="hintExit">exit</span><span id="hint-win" hidden> · <kbd data-mac="⌥W">Alt+W</kbd> <span data-i18n="hintWindow">window</span></span>
      </div>
    </header>

    <div id="tools" class="tools">
      <div class="view" role="toolbar" data-i18n-aria="viewAria">
        <button id="star-filter" class="chip" type="button" aria-pressed="false" data-i18n-title="starFilterTitle">
          <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z" fill="currentColor"/></svg>
          <span class="label" data-i18n="starred">Starred</span><span id="star-n" class="n">0</span>
        </button>
        <div id="sort" class="seg" role="radiogroup" data-i18n-aria="sortAria">
          <button type="button" role="radio" data-sort="recent" data-i18n="sortRecent" data-i18n-title="sortRecentTitle">Recent</button>
          <button type="button" role="radio" data-sort="newest" data-i18n="sortNewest" data-i18n-title="sortNewestTitle">Newest</button>
          <button type="button" role="radio" data-sort="oldest" data-i18n="sortOldest" data-i18n-title="sortOldestTitle">Oldest</button>
          <button type="button" role="radio" data-sort="name" data-i18n="sortName" data-i18n-title="sortNameTitle">A–Z</button>
          <button type="button" role="radio" data-sort="site" data-i18n="sortSite" data-i18n-title="sortSiteTitle">By site</button>
        </div>
      </div>
      <div class="setup">
        <button id="groups-btn" class="act accent" type="button" hidden data-i18n-title="groupsOnTitle">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1.5" y="3" width="5.5" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><rect x="9" y="3" width="5.5" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M1.5 6h5.5" stroke="currentColor" stroke-width="1.3"/></svg>
          <span data-i18n="groupsOn">Turn on tab groups</span>
        </button>
        <button id="dupes-btn" class="act" type="button" hidden>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><rect x="6" y="6" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
          <span id="dupes-text"></span>
        </button>
        <button id="sweep-btn" class="act" type="button" hidden>
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2.5 5.5h2.2l1.2-1.8h4.2l1.2 1.8h2.2v7h-11z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/><circle cx="8" cy="8.8" r="2" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
          <span id="sweep-text"></span>
        </button>
        <button id="panel-btn" class="act" type="button" aria-controls="panel" aria-expanded="false">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M10 2.5v11" stroke="currentColor" stroke-width="1.3"/></svg>
          <span data-i18n="panelBtn">Groups &amp; bookmarks</span>
        </button>
      </div>
    </div>
    <div id="alert" class="alert" role="alert" hidden><span id="alert-text"></span><button id="alert-btn" class="btn quiet" type="button" hidden></button></div>

    <!-- Quick actions: shown while searching or once tabs are selected. -->
    <div id="acts" class="acts" role="toolbar" hidden>
      <span id="acts-n" class="acts-n"></span>
      <button id="sel-all" class="lnk" type="button"></button>
      <button id="sel-none" class="lnk" type="button" data-i18n="selNone" hidden>Clear</button>
      <span class="grow"></span>
      <span id="acts-btns" class="acts-btns"></span>
    </div>

    <div id="body" class="body">
      <!-- Windows, on the left, each with a small preview of the tab it is showing. Hidden with one window. -->
      <nav id="wins" class="wins" data-i18n-aria="windowsAria" hidden></nav>
      <main id="scroller">
        <section aria-labelledby="open-h">
          <h2 id="open-h" class="section-h" data-i18n="openTabs">Open tabs</h2>
          <div id="open-grid" class="sections" role="listbox" aria-labelledby="open-h" aria-multiselectable="true"></div>
          <p id="open-empty" class="empty" hidden></p>
        </section>
        <section id="closed-section" aria-labelledby="closed-h" hidden>
          <h2 id="closed-h" class="section-h"></h2>
          <div id="closed-grid" class="grid small" role="listbox" aria-labelledby="closed-h"></div>
        </section>
      </main>

      <!-- Right panel, like a layers panel: saved (closed) tab groups, and Chrome bookmarks. -->
      <aside id="panel" class="panel" hidden data-i18n-aria="panelAria">
        <div class="ptabs" role="tablist">
          <button id="ptab-groups" class="ptab" type="button" role="tab" data-ptab="groups" aria-controls="pane-groups"><span data-i18n="paneGroups">Saved groups</span> <span id="ptab-groups-n" class="n"></span></button>
          <button id="ptab-marks" class="ptab" type="button" role="tab" data-ptab="marks" aria-controls="pane-marks"><span data-i18n="paneMarks">Bookmarks</span></button>
          <span class="grow"></span>
          <button id="panel-close" class="x on" type="button" data-i18n-title="panelHide" data-i18n-aria="panelHide"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
        </div>
        <div id="pane-groups" class="pane" role="tabpanel" aria-labelledby="ptab-groups"></div>
        <div id="pane-marks" class="pane" role="tabpanel" aria-labelledby="ptab-marks" hidden></div>
      </aside>
    </div>

    <div class="foot">
      <button id="tour-btn" class="link" type="button" data-i18n-title="tourTitle"><span class="q" aria-hidden="true">?</span><span data-i18n="tourBtn">How it works</span></button>
      <button id="settings-btn" class="link" type="button" data-i18n-title="settings" data-i18n-aria="settings"><svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 5.6a2.4 2.4 0 1 0 0 4.8 2.4 2.4 0 0 0 0-4.8Zm5.6 3.2-.1-1.6 1.3-1-1.3-2.3-1.6.5a5 5 0 0 0-1.4-.8L10.2 2H7.6l-.3 1.6a5 5 0 0 0-1.4.8l-1.6-.5L3 6.2l1.3 1-.1 1.6-1.2 1 1.3 2.3 1.6-.5c.4.3.9.6 1.4.8l.3 1.6h2.6l.3-1.6c.5-.2 1-.5 1.4-.8l1.6.5 1.3-2.3z" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linejoin="round"/></svg><span data-i18n="settings">Settings</span></button>
      <button id="help-btn" class="link" type="button" data-i18n="help" data-i18n-title="helpTitle">Help</button>
      <button id="feedback-btn" class="link" type="button" data-i18n="feedback" hidden>Feedback</button>
    </div>
    <div class="corner">
      <span id="peek" class="ybit-clip" aria-hidden="true"><span class="ybit-peek"></span></span>
      <button id="pro" class="pixbtn pro" type="button" hidden data-i18n-title="proTitle">
        <svg viewBox="0 0 12 12" width="16" height="16" shape-rendering="crispEdges" aria-hidden="true"><g fill="#1B2A4A"><rect x="5" y="0" width="2" height="2"/><rect x="4" y="2" width="4" height="2"/><rect x="0" y="4" width="12" height="2"/><rect x="2" y="6" width="8" height="2"/><rect x="2" y="8" width="3" height="2"/><rect x="7" y="8" width="3" height="2"/><rect x="1" y="10" width="2" height="2"/><rect x="9" y="10" width="2" height="2"/></g></svg>
        <span data-i18n="proBtn">Pro · join the waitlist</span>
      </button>
      <button id="coffee" class="pixbtn coffee" type="button" data-i18n-title="coffeeTitle">
        <svg viewBox="0 0 12 12" width="18" height="18" shape-rendering="crispEdges" aria-hidden="true"><g fill="#1B2A4A"><rect x="3" y="0" width="1" height="2"/><rect x="4" y="2" width="1" height="1"/><rect x="6" y="0" width="1" height="2"/><rect x="7" y="2" width="1" height="1"/><rect x="1" y="4" width="8" height="1"/><rect x="1" y="5" width="1" height="5"/><rect x="8" y="5" width="1" height="5"/><rect x="2" y="10" width="6" height="1"/><rect x="9" y="5" width="2" height="1"/><rect x="10" y="6" width="1" height="2"/><rect x="9" y="8" width="2" height="1"/></g><rect x="2" y="5" width="6" height="2" fill="#7A4E2D"/><rect x="2" y="7" width="6" height="3" fill="#FFF8E7"/><rect x="2" y="7" width="2" height="1" fill="#FF9EC7"/></svg><span data-i18n="coffee">Buy me a coffee</span>
      </button>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="modal" class="modal-back" hidden>
      <div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"></div>
    </div>
  </div>
  <textarea id="clip" class="clip" aria-hidden="true" tabindex="-1"></textarea>
  <script type="module" src="switcher.js"></script>
</body>
</html>
